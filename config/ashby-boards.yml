# Ashby boards scanned via the public posting API (no auth, no browser):
#   GET https://api.ashbyhq.com/posting-api/job-board/<slug>
# Each entry is the org slug in jobs.ashbyhq.com/<slug>. Verified LIVE (200 +
# non-empty jobs) by `node scripts/verify-boards.mjs ashby` on 2026-07-16.
# A dead/renamed slug costs one warning and is skipped.
companies:
  # AI / ML / LLM
  - openai          # 709 jobs
  - cohere
  - perplexity
  - elevenlabs
  - deepgram
  - harvey          # AI, legal
  - sierra          # AI agents
  - decagon         # AI agents
  - langchain       # LLM tooling
  - llamaindex      # LLM tooling
  - cursor          # AI dev tools
  - lovable         # AI dev tools
  - poolside        # AI code models
  - mercor          # AI hiring
  - suno            # generative audio
  - cartesia        # generative voice
  - sesame          # voice AI
  - pika            # generative video
  - runway          # generative video
  - browserbase     # agent infra
  # ML infra
  - baseten
  - modal
  - replit
  - watershed       # climate data/SWE
  - vanta           # security SWE
  - linear          # SWE
  - notion          # SWE
  - ramp            # SWE
  - benchling       # SWE, life sciences
  - ashby           # SWE
  # Robotics
  - skydio          # autonomous drones
  - 1x              # humanoid robotics
  - cobot           # collaborative robotics
  # Security
  - gen-digital

# Invariant 10: intern/co-op focus for Summer/Fall 2026. The scanner also keeps a
# posting when employmentType is Intern even if the title omits it.
title_include:
  - intern
  - internship
  - co-op
  - coop

title_exclude:
  - senior
  - staff
  - principal
  - director
  - manager
  - lead
