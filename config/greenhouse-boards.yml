# Greenhouse boards scanned via the public boards API (no auth, no browser).
# Every token below was verified LIVE (HTTP 200 + non-empty jobs) by
# `node scripts/verify-boards.mjs gh` on 2026-07-16. A dead/renamed token costs
# one warning and is skipped. Re-run the verify script before a big edit.
# The ROLE matters, not the company: the watcher's on-field + junior + freshness
# filters decide what surfaces, so a broad board list only widens coverage.
boards:
  # AI / ML / LLM
  - anthropic
  - scaleai
  - snorkelai
  - cresta
  - xai
  - togetherai
  - speechify
  - typeface
  - stabilityai
  - imbue
  - assemblyai
  - coreweave       # GPU cloud / ML infra
  # Robotics / AV / drones / space
  - waymo           # autonomous vehicles
  - nuro            # autonomous delivery robotics
  - motional        # autonomous vehicles
  - wayve           # AV / end-to-end driving
  - figure          # humanoid robotics
  - agilityrobotics # humanoid robotics
  - pathrobotics    # welding robotics
  - astranis        # space / satellites
  - flyzipline      # autonomous delivery drones
  - trueanomalyinc  # space
