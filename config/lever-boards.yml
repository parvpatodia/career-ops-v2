# Lever boards scanned via the public postings API (no auth, no browser).
# Each entry is the company slug in jobs.lever.co/<slug>. Verified LIVE (200 +
# non-empty array) by `node scripts/verify-boards.mjs lever` on 2026-07-16.
# A dead/renamed slug costs one warning and is skipped.
companies:
  - palantir      # data/AI SWE (clearance roles filtered by F-1 eligibility gate)
  - zoox          # autonomous vehicles
  - gopuff        # logistics SWE
  - spotify       # SWE / ML
  - matchgroup    # SWE
  - angellist     # SWE
  # Expanded 2026-07-17 (verify-boards, live): robotics/AV/AI infra + SWE
  - waabi         # autonomous trucking (AV)
  - osaro         # robotics / CV
  - brightmachines # robotics manufacturing
  - anyscale      # ML infrastructure (Ray)
  - includedhealth # health SWE
  - neon          # serverless Postgres SWE
  - alloy         # fintech identity SWE
  - sysdig        # cloud security SWE
  - tinybird      # data infra SWE
  # Removed 2026-07-16: plaid, mistral (now 404 on Lever — moved ATS). ramp/brex/
  # anduril already removed earlier for the same reason.

# Invariant 10: intern/co-op focus for Summer/Fall 2026. The scanner also keeps
# a posting when categories.commitment is Internship even if the title omits it.
title_include:
  - intern
  - internship
  - co-op
  - coop

title_exclude:
  - senior
  - staff
  - principal
  - director
  - manager
  - lead
