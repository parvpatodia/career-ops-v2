# Lever boards scanned via the public postings API (no auth, no browser).
# Each entry is the company slug in jobs.lever.co/<slug>. A dead/renamed slug
# costs one warning and is skipped. Curate this toward companies you target;
# verify a slug by opening https://jobs.lever.co/<slug>.
companies:
  # Verified live against the postings API 2026-07-11 (200, valid board).
  - plaid
  - mistral
  - zoox          # 218 postings, jobs.lever.co/zoox (autonomous vehicles)
  - palantir      # 273 postings, jobs.lever.co/palantir (data/AI SWE)
  # Removed 2026-07-11: ramp, brex, anduril all 404 on Lever now (moved ATS) —
  # they were 404-spamming the log and wasting a request every 5-min watch run.

# Invariant 10: intern/co-op focus for Summer/Fall 2026. The scanner also keeps
# a posting when categories.commitment is Internship even if the title omits it.
title_include:
  - intern
  - internship
  - co-op
  - coop

title_exclude:
  - senior
  - staff
  - principal
  - director
  - manager
  - lead
