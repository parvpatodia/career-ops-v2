name: Tests

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
        env:
          # Unit tests never launch a browser; skip the ~200MB download.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Same command devs run locally. Profile-dependent suites self-skip
      # because config/profile.yml is gitignored personal data.
      - run: npx vitest run
